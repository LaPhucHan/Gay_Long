name: CI/CD - Build & Push Next.js Image to Docker Hub

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout nguồn mã nguồn từ Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Docker Hub bằng Secrets đã tạo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 3: Đặt cấu hình Docker Buildx để tối ưu hóa quá trình build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 4: Build và Push Docker Image lên Docker Hub (Cập nhật v6)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gay_long:latest
            ${{ secrets.DOCKER_USERNAME }}/gay_long:${{ github.sha }}